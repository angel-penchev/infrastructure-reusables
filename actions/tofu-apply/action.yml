name: "OpenTofu apply"
description: >-
  Applies a management plane's OpenTofu and posts the outcome on the pull
  request the applied commit belongs to: the one a push to the default branch
  merged, or the one open for the branch a manual run applied. Every apply is
  a new comment. A failed apply fails the step after it has been posted.
inputs:
  working_directory:
    description: "The OpenTofu root module"
    required: false
    default: "tofu"
  vault_token:
    description: "Token for the plane's OpenBao, as VAULT_TOKEN"
    required: true
  parallelism:
    description: >-
      Operations OpenTofu runs at once. Each NixOS host or ISO a plan reads is
      a Nix evaluation of up to about 0.75 GB, so this bounds the plane's
      memory however many hosts the repository has.
    required: false
    default: "4"
  branch:
    description: "Branch or tag a manual run applied; empty for a push"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: OpenTofu init
      shell: bash
      run: tofu -chdir="$WORKING_DIRECTORY" init -input=false
      env:
        WORKING_DIRECTORY: ${{ inputs.working_directory }}

    - name: OpenTofu apply
      id: apply
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
        VAULT_TOKEN: ${{ inputs.vault_token }}
        PARALLELISM: ${{ inputs.parallelism }}
      run: |
        set +e -o pipefail
        tofu -chdir="$WORKING_DIRECTORY" apply -auto-approve -no-color -input=false -parallelism="$PARALLELISM" 2>&1 | tee "$RUNNER_TEMP/tofu-apply.txt"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Post the apply to the pull request
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        APPLY_EXIT_CODE: ${{ steps.apply.outputs.exit_code }}
        APPLY_OUTPUT_FILE: ${{ runner.temp }}/tofu-apply.txt
        APPLY_BRANCH: ${{ inputs.branch }}
        COMMENT_SCRIPT: ${{ github.action_path }}/comment.js
      with:
        script: await require(process.env.COMMENT_SCRIPT)({ github, context, core });

    - name: Fail if the apply failed
      if: steps.apply.outputs.exit_code != '0'
      shell: bash
      run: |
        echo "::error::OpenTofu apply failed; see the log above or the pull request comment."
        exit 1
